project_id = "otf"

[auth]
site_url = "https://otfroots.com"
additional_redirect_urls = ["https://otfroots.com/", "https://otf-theta.vercel.app/", "http://127.0.0.1:5174/"]
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = true

# Links carry a token hash, so they work on any device (for example, opened from a phone's mail app).
# The hosted project needs the same two templates set in Authentication → Email Templates.
[auth.email.template.confirmation]
subject = "Confirm your OTF account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your OTF password"
content_path = "./supabase/templates/recovery.html"
